services:
  cn-proxy:
    image: metacubex/mihomo:v1.19.28
    command:
      - -d
      - /root/.config/mihomo
      - -f
      - /etc/mihomo/config.yaml
    volumes:
      - ${CN_PROXY_CONFIG_PATH:?set CN_PROXY_CONFIG_PATH in .env}:/etc/mihomo/config.yaml:ro
      - cn-proxy-data:/root/.config/mihomo
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 127.0.0.1 ${CN_PROXY_PORT:-7891}"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    networks:
      - gateway

  # Browser stays opt-in so edge-only deployments do not start Chromium. A
  # server-side control deployment enables the profile explicitly and sets
  # ICLOUD_GATEWAY_CDP_URL=http://browser:9222.
  browser:
    profiles:
      - legacy-browser
    environment:
      BROWSER_PROXY_PASSWORD: ${BROWSER_PROXY_PASSWORD:-}
      BROWSER_PROXY_REQUIRED: ${BROWSER_PROXY_REQUIRED:-0}
      BROWSER_PROXY_SERVER: ${BROWSER_PROXY_SERVER:-}
      BROWSER_PROXY_USERNAME: ${BROWSER_PROXY_USERNAME:-}
    depends_on:
      cn-proxy:
        condition: service_healthy
    networks:
      gateway:
      edge:
        aliases:
          - icloud-code-gateway-browser

  app:
    environment:
      ICLOUD_GATEWAY_CDP_URL: ${ICLOUD_GATEWAY_CDP_URL:-}
      ICLOUD_GATEWAY_HME_PROXY_PASSWORD: ${ICLOUD_GATEWAY_HME_PROXY_PASSWORD:-}
      ICLOUD_GATEWAY_HME_PROXY_REQUIRED: ${ICLOUD_GATEWAY_HME_PROXY_REQUIRED:-0}
      ICLOUD_GATEWAY_HME_PROXY_SERVER: ${ICLOUD_GATEWAY_HME_PROXY_SERVER:-}
      ICLOUD_GATEWAY_HME_PROXY_USERNAME: ${ICLOUD_GATEWAY_HME_PROXY_USERNAME:-}
      ICLOUD_GATEWAY_HME_MAINTENANCE_SECONDS: ${ICLOUD_GATEWAY_HME_MAINTENANCE_SECONDS:-21600}
      ICLOUD_GATEWAY_HME_FRESHNESS_SECONDS: ${ICLOUD_GATEWAY_HME_FRESHNESS_SECONDS:-3600}
      ICLOUD_GATEWAY_HME_RETRY_MAX_SECONDS: ${ICLOUD_GATEWAY_HME_RETRY_MAX_SECONDS:-3600}
      ICLOUD_GATEWAY_ALIAS_BATCH_LIMIT: ${ICLOUD_GATEWAY_ALIAS_BATCH_LIMIT:-100}
      ICLOUD_GATEWAY_DEPLOYMENT_MODE: ${ICLOUD_GATEWAY_DEPLOYMENT_MODE:-edge}
      ICLOUD_GATEWAY_CONTROL_PLANE_TOKEN: ${ICLOUD_GATEWAY_CONTROL_PLANE_TOKEN:?set ICLOUD_GATEWAY_CONTROL_PLANE_TOKEN in .env}
      ICLOUD_GATEWAY_EDGE_BASE_URL: ${ICLOUD_GATEWAY_EDGE_BASE_URL:-}
      ICLOUD_GATEWAY_EDGE_SYNC_ENABLED: ${ICLOUD_GATEWAY_EDGE_SYNC_ENABLED:-0}
      ICLOUD_GATEWAY_EDGE_TIMEOUT_SECONDS: ${ICLOUD_GATEWAY_EDGE_TIMEOUT_SECONDS:-20}
    depends_on:
      cn-proxy:
        condition: service_healthy
    networks:
      gateway:
      edge:
        aliases:
          - icloud-code-gateway-app

  caddy:
    profiles:
      - standalone-caddy

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-app_yunbay-network}

volumes:
  cn-proxy-data:
