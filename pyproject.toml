[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "icloud-code-gateway"
version = "0.1.0"
description = "Access-key scoped iCloud Hide My Email verification-code gateway"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "cryptography>=43,<47",
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "playwright>=1.58,<2",
  "python-multipart>=0.0.20,<1",
  "requests[socks]>=2.31,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
icloud-code-gateway = "icloud_gateway.main:run"

[tool.hatch.build.targets.wheel]
packages = ["icloud_gateway"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
